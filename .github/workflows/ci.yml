name: CI

on:
  schedule:
    - cron: 0 0 * * 1 # weekly, Monday 00:00 UTC
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Many color libraries just need this to be set to any value, but at least
  # one distinguishes color depth, where "3" -> "256-bit color".
  FORCE_COLOR: 3

jobs:
  pre-commit:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --hook-stage manual --all-files

  checks:
    name:
      Check Python ${{ matrix.python-version }} on ${{ matrix.runs-on }}${{
      matrix.network && ' (network)' || '' }}
    runs-on: ${{ matrix.runs-on }}
    needs: [pre-commit]
    strategy:
      fail-fast: false
      matrix:
        # Test against at least 3 most recent Python versions
        # NOTE: 3.15 blocked by maxar-platform -> pygeofilter<0.3 -> lark<1 (imports sre_parse)
        python-version: ["3.12", "3.13", "3.14"]
        runs-on: [ubuntu-latest]
        include:
          # Only test latest Python on macOS
          - python-version: "3.14"
            runs-on: macos-latest
          # Only run network tests on one job
          - python-version: "3.14"
            runs-on: ubuntu-latest
            network: true

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: "true" # source .venv/bin/activate

      - name: Install package
        run: uv pip install '.[dev]'

      - name: Test package
        if: ${{ !matrix.network }}
        run: >-
          python -m pytest -ra -m "not network" --cov --cov-report=term
          --durations=20

      - name: Test package (network)
        if: ${{ matrix.network }}
        env:
          VANTOR_API_KEY: ${{ secrets.VANTOR_API_KEY}}
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN}}
          NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN}}
        run: >-
          python -m pytest -ra --cov --cov-report=term --durations=20
