name: Pixi

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          environments: dev
          manifest-path: pyproject.toml
          cache: true
          frozen: true

      # NOTE: https://github.com/prefix-dev/setup-pixi/issues/136
      - name: Ensure Dynamic version
        run: |
          pip install -e . --no-deps

      - name: Run Pylint
        continue-on-error: true
        run: |
          pixi run lint

      - name: Run mypy
        run: |
          pixi run typecheck

      - name: Run Pytest
        if: github.event_name != 'workflow_dispatch'
        run: |
          pixi run test

      # Network tests only run on demand
      - name: Run Pytest (network)
        if: github.event_name == 'workflow_dispatch'
        env:
          VANTOR_API_KEY: ${{ secrets.VANTOR_API_KEY}}
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN}}
          NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN}}
        run: |
          pixi run networktest
